name: Test

on:
  push:
    branches:
      - n-air_development

  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.common == 'true' || steps.filter.outputs.app == 'true' }}
      bin: ${{ steps.filter.outputs.common == 'true' || steps.filter.outputs.bin == 'true' }}
    steps:
      - name: Checkout if push
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ github.event_name == 'push' }}

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            common:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/test.yml'
            app:
              - 'installer.nsh'
              - 'tsconfig.json'
              - 'webpack.config.js'
              - 'main.js'
              - 'test-main.js'
              - 'app/**'
              - 'media/**'
              - 'nvoice/**'
              - 'obs-api/**'
              - 'test/**'
              - 'updater/**'
              - 'vendor/**'
              - 'jest.config.js'
            bin:
              - 'bin/package.json'
              - 'bin/pnpm-lock.yaml'
              - 'bin/**/*.js'
              - 'jest.bin-config.js'

  setup-app:
    name: setup(app)
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' || needs.changes.outputs.bin == 'true' }}
    runs-on: windows-2022
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: cache node modules
        id: cache-node-modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'additional/additional.json', 'additional/main.mjs') }}

      - name: npm login
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> $env:USERPROFILE\.npmrc

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
        env:
          PNPM_VERIFY_BUILDS: "false"

  setup-bin:
    name: setup(bin)
    needs: changes
    if: ${{ needs.changes.outputs.bin == 'true' }}
    runs-on: windows-2022
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      - name: cache node modules(bin)
        id: cache-node-modules-bin
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: bin/node_modules
          key: ${{ runner.os }}-node-bin-${{ hashFiles('bin/pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules-bin.outputs.cache-hit != 'true'
        run: pnpm install --dir bin --ignore-workspace --frozen-lockfile

  unit_test-app:
    name: unit tests(app)
    needs: [changes, setup-app]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: windows-2022
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      - name: cache node modules
        id: cache-node-modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'additional/additional.json', 'additional/main.mjs') }}

      - name: Run unit tests(app)
        run: pnpm run test:unit:app

  unit_test-bin:
    name: unit tests(bin)
    needs: [changes, setup-app, setup-bin]
    if: ${{ needs.changes.outputs.bin == 'true' }}
    runs-on: windows-2022
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      - name: cache node modules
        id: cache-node-modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'additional/additional.json', 'additional/main.mjs') }}

      - name: cache node modules(bin)
        id: cache-node-modules-bin
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: bin/node_modules
          key: ${{ runner.os }}-node-bin-${{ hashFiles('bin/pnpm-lock.yaml') }}

      - name: Run unit tests(bin)
        run: pnpm run test:unit:bin

  e2e_test:
    name: e2e tests
    needs: [changes, setup-app]
    runs-on: windows-2022
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        directory:
          - 'e2e/[^s]*.js'
          - 'e2e/s*.js'
          - 'api/[^s]*.js'
          - 'api/s*.js'

    steps:
      - name: Checkout code
        if: ${{ needs.changes.outputs.app == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        if: ${{ needs.changes.outputs.app == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install pnpm
        if: ${{ needs.changes.outputs.app == 'true' }}
        run: corepack enable pnpm

      - name: cache node modules
        if: ${{ needs.changes.outputs.app == 'true' }}
        id: cache-node-modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'additional/additional.json', 'additional/main.mjs') }}

      - name: Compile
        if: ${{ needs.changes.outputs.app == 'true' }}
        run: pnpm run compile:ci

      - name: Run e2e tests
        if: ${{ needs.changes.outputs.app == 'true' }}
        run: pnpm test --fail-fast test-dist/test/${{ matrix.directory }}

  build_check:
    name: build check
    needs: [changes, setup-app]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: windows-2022
    permissions:
      contents: read
      packages: read
    env:
      MIN_INSTALLER_SIZE_MB: 300  # Minimum installer size in MB (adjust if needed)

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      - name: cache node modules
        id: cache-node-modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'additional/additional.json', 'additional/main.mjs') }}

      - name: cache node modules(bin)
        if: ${{ needs.changes.outputs.bin == 'true' }}
        id: cache-node-modules-bin
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: bin/node_modules
          key: ${{ runner.os }}-node-bin-${{ hashFiles('bin/pnpm-lock.yaml') }}

      - name: Get electron-builder version
        id: electron-builder-version
        run: |
          $version = (Get-Content node_modules/electron-builder/package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: cache electron-builder
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-builder-${{ steps.electron-builder-version.outputs.version }}

      - name: Compile production
        run: pnpm run compile:production

      - name: Package local
        run: pnpm run package:local -- --publish never

      - name: Check installer size
        shell: pwsh
        run: |
          $minSize = [int]$env:MIN_INSTALLER_SIZE_MB
          $installers = Get-ChildItem -Path dist -Filter "*.exe" -File
          if ($installers.Count -eq 0) {
            echo "::error::No installer .exe found in dist/"
            exit 1
          }
          foreach ($file in $installers) {
            $sizeMB = [math]::Round($file.Length / 1MB, 2)
            echo "Installer: $($file.Name), Size: ${sizeMB} MB"
            if ($file.Length -lt ($minSize * 1024 * 1024)) {
              echo "::error::Installer $($file.Name) is ${sizeMB} MB, which is less than the minimum ${minSize} MB"
              exit 1
            }
          }
          echo "All installers meet the minimum size requirement of ${minSize} MB"

  test-summary:
    # 注意: needs に setupも入れないと、setupで失敗すると後段のresultが `skipped` になってしまい、すりぬけてしまう
    needs: [setup-app, setup-bin, unit_test-app, unit_test-bin, e2e_test, build_check]
    if: always()
    permissions: {}
    steps:
      - name: test-summary
        run: |
          echo '${{ toJson(needs) }}'
          RESULT=${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
          echo RESULT=$RESULT
          if [[ $RESULT == true ]]; then
            echo "All tests passed"
          else
            echo "Some tests failed"
            exit 1
          fi
    runs-on: ubuntu-latest
