name: Test

on:
  push:
    branches:
      - n-air_development

  pull_request:

jobs:
  changes:
    runs-on: windows-2022
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.common == 'true' || steps.filter.outputs.app == 'true' }}
      bin: ${{ steps.filter.outputs.common == 'true' || steps.filter.outputs.bin == 'true' }}
    steps:
      - name: Checkout if push
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ github.event_name == 'push' }}

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            common:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/test.yml'
            app:
              - 'installer.nsh'
              - 'tsconfig.json'
              - 'webpack.config.js'
              - 'main.js'
              - 'test-main.js'
              - 'app/**'
              - 'media/**'
              - 'nvoice/**'
              - 'obs-api/**'
              - 'test/**'
              - 'updater/**'
              - 'vendor/**'
              - 'jest.config.js'
            bin:
              - 'bin/package.json'
              - 'bin/pnpm-lock.yaml'
              - 'bin/**/*.js'
              - 'jest.bin-config.js'

  setup-app:
    name: setup(app)
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' || needs.changes.outputs.bin == 'true' }}
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: cache pnpm store
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: cache node modules
        id: cache-node-modules
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'additional/additional.json', 'additional/main.mjs') }}

      - name: npm login
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> $env:USERPROFILE\.npmrc

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
        env:
          PNPM_VERIFY_BUILDS: "false"

  setup-bin:
    name: setup(bin)
    needs: changes
    if: ${{ needs.changes.outputs.bin == 'true' }}
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      - name: cache node modules(bin)
        id: cache-node-modules-bin
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/node_modules
          key: ${{ runner.os }}-node-bin-${{ hashFiles('bin/pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules-bin.outputs.cache-hit != 'true'
        run: pnpm install --dir bin --ignore-workspace --frozen-lockfile

  unit_test-app:
    name: unit tests(app)
    needs: [changes, setup-app]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      - name: cache node modules
        id: cache-node-modules
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'additional/additional.json', 'additional/main.mjs') }}

      - name: Run unit tests(app)
        run: pnpm run test:unit:app

  unit_test-bin:
    name: unit tests(bin)
    needs: [changes, setup-app, setup-bin]
    if: ${{ needs.changes.outputs.bin == 'true' }}
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable pnpm

      - name: cache node modules
        id: cache-node-modules
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'additional/additional.json', 'additional/main.mjs') }}

      - name: cache node modules(bin)
        id: cache-node-modules-bin
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/node_modules
          key: ${{ runner.os }}-node-bin-${{ hashFiles('bin/pnpm-lock.yaml') }}

      - name: Run unit tests(bin)
        run: pnpm run test:unit:bin

  e2e_test:
    name: e2e tests
    needs: [changes, setup-app]
    runs-on: windows-2022
    strategy:
      matrix:
        directory:
          - 'e2e/[^s]*.js'
          - 'e2e/s*.js'
          - 'api/[^s]*.js'
          - 'api/s*.js'

    steps:
      - name: Checkout code
        if: ${{ needs.changes.outputs.app == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        if: ${{ needs.changes.outputs.app == 'true' }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22

      - name: Install pnpm
        if: ${{ needs.changes.outputs.app == 'true' }}
        run: corepack enable pnpm

      - name: cache node modules
        if: ${{ needs.changes.outputs.app == 'true' }}
        id: cache-node-modules
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'additional/additional.json', 'additional/main.mjs') }}

      - name: Compile
        if: ${{ needs.changes.outputs.app == 'true' }}
        run: pnpm run compile:ci

      - name: Run e2e tests
        if: ${{ needs.changes.outputs.app == 'true' }}
        run: pnpm test --fail-fast test-dist/test/${{ matrix.directory }}

  test-summary:
    # 注意: needs に setupも入れないと、setupで失敗すると後段のresultが `skipped` になってしまい、すりぬけてしまう
    needs: [setup-app, setup-bin, unit_test-app, unit_test-bin, e2e_test]
    if: always()
    steps:
      - name: test-summary
        run: |
          echo '${{ toJson(needs) }}'
          RESULT=${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
          echo RESULT=$RESULT
          if [[ $RESULT == true ]]; then
            echo "All tests passed"
          else
            echo "Some tests failed"
            exit 1
          fi
    runs-on: ubuntu-latest
