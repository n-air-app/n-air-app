version: 2
updates:
  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '開発:'

  # Root npm dependencies
  # 依存更新を追いかけられる状況になるまで新規PR作成を停止中 (open-pull-requests-limit: 0)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    versioning-strategy: increase
    ignore:
      # @n-air-app/* パッケージは内製なので即座に更新可能
      - dependency-name: '@n-air-app/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      # @types/nodeはElectron 29が内蔵するNode.js 20.9.0系に合わせて20系に固定する。
      # メジャー更新(21以上)はElectronのバンドルNode.jsと型定義がずれるため無視する
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      external-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - '@n-air-app/*'
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: '開発:'

  # bin/ npm dependencies
  - package-ecosystem: 'npm'
    directory: '/bin'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      bin-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: '開発:'
