    <title>N Air</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #17242d;
        font-family: 'Segoe UI', sans-serif;
        position: relative;
      }

      .logo-svg {
        width: 200px;
        height: auto;
        margin-bottom: 48px;
        color: #9eeaf9;
      }

      .status {
        color: #ffffff;
        font-size: 14px;
        opacity: 0.82;
        margin-bottom: 18px;
        min-height: 20px;
      }

      .progress-track {
        width: 240px;
        height: 3px;
        overflow: hidden;
        border-radius: 2px;
        background: rgb(255 255 255 / 14%);
      }

      .progress-bar {
        width: 12%;
        height: 100%;
        border-radius: inherit;
        background: #9eeaf9;
        transition: width 300ms ease-out;
      }

      .version {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-size: 12px;
        opacity: 0.5;
      }

    </style>
  </head>

    <div class="status" id="status">起動準備中…</div>
    <div class="progress-track">
      <div class="progress-bar" id="progress"></div>
    </div>
    <div class="version" id="version"></div>
    <script>
      const { ipcRenderer } = require('electron');

      // Display version information from environment variable
      // Note: nodeIntegration is enabled for this window to access process.env
      const version = process.env.NAIR_VERSION || '';
      const versionElement = document.getElementById('version');
      if (version && versionElement) {
        versionElement.textContent = 'Version ' + version;
      } else {
        console.log('Version element or version not found', { version, versionElement });
      }

      ipcRenderer.on('splash-status', (_event, { status, progress }) => {
        const statusElement = document.getElementById('status');
        const progressElement = document.getElementById('progress');
        if (statusElement) statusElement.textContent = status;
        if (progressElement) progressElement.style.width = `${progress}%`;
      });
    </script>
